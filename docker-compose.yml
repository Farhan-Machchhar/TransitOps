version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: transitops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transitops"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/transitops?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-super-secret-transitops-key-2024}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    # Using a shell command in docker-compose to run prisma migrations then start the server
    # Note: we need to run it as root or ensure nextjs user has permissions. 
    # Actually, standalone Next.js image might not have prisma cli globally. 
    # Let's run prisma migrate in the container if possible, or just expect it to run.
    command: >
      sh -c "npx prisma migrate deploy && node server.js"
    user: "1001"

volumes:
  postgres_data:
